[workspace]
members = ["programs/*"]
resolver = "2"

# Use the local light-protocol SDK checkout instead of the released crates.
# Patching light-sdk, light-hasher and light-client to local paths pulls their
# entire transitive light-* graph from the ~/dev/light/light-sdks workspace.
[patch.crates-io]
light-sdk = { path = "/Users/jorrit/dev/light/light-sdks/sdk" }
light-hasher = { path = "/Users/jorrit/dev/light/light-sdks/hasher" }
light-client = { path = "/Users/jorrit/dev/light/light-sdks/client" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
