[package]
name = "counter"
version = "0.0.11"
description = "Created with Anchor"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = ["idl-build"]
test-sbf = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
light-hasher = "7.0.0"
light-sdk = { version = "0.25.0", features = ["anchor", "cpi-context", "keccak"] }

[dev-dependencies]
light-client = "0.25.0"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519", "sha2"] }
solana-signature = "3.4"
solana-signer = "3.0"

# solana-keypair -> five8 1.0 -> five8_core 0.1.2 gates `impl Error for
# DecodeError` behind `std`; enable it so the error type satisfies the bound.
five8_core = { version = "0.1.2", features = ["std"] }

tokio = "1.49.0"
