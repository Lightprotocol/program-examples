[package]
name = "counter"
version = "1.0.0"
description = "Native counter program using light protocol"
repository = "https://github.com/Lightprotocol/program-examples"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
test-sbf = []
default = []

[dependencies]
light-sdk = { version = "0.25.0", features = ["keccak"] }
light-hasher = "7.0.0"
solana-program = "4.0"
light-macros = "3.0.0"
borsh = "1.7"

[dev-dependencies]
light-client = "0.25.0"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519", "sha2"] }
solana-signature = "3.4"
solana-signer = "3.0"

# solana-keypair -> five8 1.0 -> five8_core 0.1.2 gates `impl Error for
# DecodeError` behind `std`; enable it so the error type satisfies the bound.
five8_core = { version = "0.1.2", features = ["std"] }

tokio = "1.49.0"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
