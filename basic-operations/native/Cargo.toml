[workspace]
members = [
    "programs/create",
    "programs/update",
    "programs/close",
    "programs/reinit",
    "programs/burn",
]
resolver = "2"

# Use the local light-protocol SDK checkout instead of the released crates.
[patch.crates-io]
light-sdk = { path = "/Users/jorrit/dev/light/light-sdks/sdk" }
light-hasher = { path = "/Users/jorrit/dev/light/light-sdks/hasher" }
light-client = { path = "/Users/jorrit/dev/light/light-sdks/client" }
light-macros = { path = "/Users/jorrit/dev/light/light-sdks/macros" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
