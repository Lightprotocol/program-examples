[package]
name = "account-comparison"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "account_comparison"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "1.0.2"
light-hasher = "7.0.0"
light-sdk = { version = "0.25.0", features = ["anchor", "cpi-context", "keccak"] }

[dev-dependencies]
light-client = "0.25.0"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519", "sha2"] }
solana-signature = "3.4"
solana-signer = "3.0"

# solana-keypair -> five8 1.0 -> five8_core 0.1.2 gates `impl Error for
# DecodeError` behind `std`; enable it so the error type satisfies the bound.
five8_core = { version = "0.1.2", features = ["std"] }

tokio = "1.49.0"

# test_solana_account.rs runs against LiteSVM (not the Light validator). These
# match the local solana-3/4 stack used by the other dev-deps.
litesvm = "0.12.0"
solana-message = "3.1"
solana-transaction = "3.1"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
