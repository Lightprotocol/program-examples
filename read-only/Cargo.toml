[package]
name = "read-only"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "read_only"

[features]
default = []
test-sbf = []

[dependencies]
anchor-lang = "1.0.2"
light-sdk = { version = "0.25.0", features = ["anchor", "cpi-context", "keccak"] }

[dev-dependencies]
light-client = "0.25.0"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519", "sha2"] }
solana-signature = "3.4"
solana-signer = "3.0"

# solana-keypair -> five8 1.0 -> five8_core 0.1.2 gates `impl Error for
# DecodeError` behind `std`; enable it so the error type satisfies the bound.
five8_core = { version = "0.1.2", features = ["std"] }

tokio = "1.49.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
